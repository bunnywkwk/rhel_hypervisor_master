---
# ==============================================================================
# CIS Hardening Variables — RHEL 9 (Level 1 Server Profile Only)
# ==============================================================================

# 1. Enforce Level 1 Benchmark Only (Disable Level 2)
rhel9cis_level_1: true
rhel9cis_level_2: false

# 2. General Safety & Environment Settings
rhel9cis_disruption_high: false
rhel9cis_authselect_custom_profile_name: rhel9_hardened_profile

# 3. Hypervisor Networking & Virtual Switch Protection
rhel9cis_sysctl_net_ipv4_ip_forward: 1
rhel9cis_rule_3_1_1: false # Prevents CIS from disabling net.ipv4.ip_forward

# 4. Web Console & Management Protection
rhel9cis_firewalld_services:
  - ssh
  - cockpit
rhel9cis_allow_cockpit: true
rhel9cis_sshd_allowusers: "frqadmin"

# 5. Virtualization Kernel Driver Whitelist
rhel9cis_whitelist_kernel_modules:
  - kvm
  - kvm_intel
  - kvm_amd
  - vhost_net
  - tun

# 6. Explicitly Disable ALL Level 2 Rules (Server + Workstation: 64 Rules)
