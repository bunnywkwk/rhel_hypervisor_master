---
# CIS Hardening Variables — RHEL 9 (Level 1 Server Profile Only)

# ==============================================================================
# KVM HYPERVISOR PROTECTION OVERRIDE
# Prevents the CIS hardening role from destroying the KVM virtualization stack.
# (The RHEL 9 CIS role has no Cockpit rule, so Cockpit needs no override here.)
# ==============================================================================

# VIRTUAL NETWORKING (DNSMASQ)
# CIS Rule 2.1.5 uninstalls dnsmasq. However, libvirt STRICTLY requires dnsmasq
# to provide DHCP/DNS to your virtual machines on the virbr0 bridge network!
rhel9cis_dnsmasq_server: true

# throw and error wherein if you did not specify your own authselect profile
rhel9cis_authselect_custom_profile_name: "rhel9"
rhel9cis_sshd_allowusers: "frqadmin"

# 3. PAM FAILLOCK (Account Lockout) — Fully Disabled
# Disabling the module itself (5.3.2.2) plus its three config controls so no
# failed-login lockout is applied to any account, admin included.
rhel9cis_rule_5_3_2_2: false # Ensure pam_faillock module is enabled
rhel9cis_rule_5_3_3_1_1: false # Ensure password failed attempts lockout is configured (deny=)
rhel9cis_rule_5_3_3_1_2: false # Ensure password unlock time is configured
rhel9cis_rule_5_3_3_1_3: false # Ensure password failed attempts lockout includes root account

# ==============================================================================
# USER-DEFINED EXEMPTIONS (Disabled Rules)
# Note: These rules are 'true' by default in the CIS role. Setting them to 'false'
# here is required if you intentionally want to bypass them.
