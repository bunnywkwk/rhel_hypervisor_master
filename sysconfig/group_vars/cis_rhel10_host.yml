---
# CIS Hardening Variables — RHEL 10 (Level 1 Server Profile Only)

# ==============================================================================
# KVM HYPERVISOR & COCKPIT PROTECTION OVERRIDES
# These overrides are CRITICAL to prevent the CIS hardening role from destroying
# the KVM virtualization stack and the Cockpit web console.
# ==============================================================================

# 1. COCKPIT WEB CONSOLE
# CIS Rule 2.1.3 typically uninstalls and masks cockpit to reduce attack surface.
# We set server to true (keep package) and mask to false (allow service to run).
rhel10cis_cockpit_server: true

# 2. VIRTUAL NETWORKING (DNSMASQ)
# CIS Rule 2.1.6 uninstalls dnsmasq. However, libvirt STRICTLY requires dnsmasq
# to provide DHCP/DNS to your virtual machines on the virbr0 bridge network!
rhel10cis_dnsmasq_server: true

# ==============================================================================
# GENERAL CIS PROFILE SETTINGS
# ==============================================================================
# throw and error wherein if you did not specify your own authselect profile
rhel10cis_authselect_custom_profile_name: "rhel10"
rhel10cis_sshd_allowusers: "frqadmin"

# 3. PAM FAILLOCK (Account Lockout) — Fully Disabled
# Disabling the module itself (5.3.1.2) plus its three config controls so no
# failed-login lockout is applied to any account, admin included.
rhel10cis_rule_5_3_1_2: false # Ensure pam_faillock module is enabled
rhel10cis_rule_5_3_2_1_1: false # Ensure password failed attempts lockout is configured (deny=)
rhel10cis_rule_5_3_2_1_2: false # Ensure password unlock time is configured
rhel10cis_rule_5_3_2_1_3: false # Ensure password failed attempts lockout includes root account

# USER-DEFINED EXEMPTIONS (Disabled Rules)
# Note: These rules are 'true' by default in the CIS role. Setting them to 'false'
# here is required if you intentionally want to bypass them.
