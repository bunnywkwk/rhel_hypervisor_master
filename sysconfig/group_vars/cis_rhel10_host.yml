---
# ==============================================================================
# CIS Hardening Variables — RHEL 10 (Level 1 Server Profile Only)
# ==============================================================================
# VM management to tretain
rhel10cis_cockpit_mask: true

# 1. Enforce Level 1 Benchmark Only (Disable Level 2)
rhel10cis_level_1: true
rhel10cis_level_2: false

# 2. General Safety & Environment Settings
rhel10cis_disruption_high: false
rhel10cis_authselect_custom_profile_name: rhel10_hardened_profile

# 3. Hypervisor Networking & Virtual Switch Protection
rhel10cis_sysctl_net_ipv4_ip_forward: 1
rhel10cis_rule_3_1_1: false # Prevents CIS from disabling net.ipv4.ip_forward

# 4. Web Console & Management Protection
rhel10cis_firewalld_services:
  - ssh
  - cockpit
rhel10cis_allow_cockpit: true
rhel10cis_sshd_allowusers: "frqadmin"

# 5. Virtualization Kernel Driver Whitelist
rhel10cis_whitelist_kernel_modules:
  - kvm
  - kvm_intel
  - kvm_amd
  - vhost_net
  - tun

# 6. Explicitly Disable ALL Level 2 Rules (Server + Workstation: 82 Rules)
