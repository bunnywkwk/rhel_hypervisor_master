---
# All hypervisor nodes (For KVM & Cockpit Provisioning)
kvm_hosts:
  hosts:
    rhel9_hypervisor:
      ansible_host: 192.168.20.20
      ansible_user: frqadmin
      ansible_ssh_common_args: "-o ProxyJump=frqadmin@192.168.10.160"
    rhel10_hypervisor:
      ansible_host: <ip-placeholder>
      ansible_user: <host-placeholder>

# Group 2: CIS securty Classification
cis:
  children:
    cis_rhel9_host:
      hosts:
        rhel9_hypervisor:
    cis_rhel10_host:
      hosts:
        rhel10_hypervisor:
